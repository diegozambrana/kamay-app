name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: "latest" resuelve vía la API de GitHub sin autenticar
          # y falla por rate limit en los runners compartidos.
          version: 2.115.0

      - name: Start Supabase
        run: supabase start

      - name: Integration tests (app)
        run: npm run test:integration

      - name: Integration tests (pgTAP)
        run: supabase test db

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
