name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # La suite e2e ya ronda los 23 min en un runner compartido y, con el resto
    # del trabajo, el tope de 30 min cortaba el último paso —el del service
    # worker tras un despliegue— aunque todo hubiera pasado.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: "latest" resuelve vía la API de GitHub sin autenticar
          # y falla por rate limit en los runners compartidos.
          version: 2.115.0

      - name: Start Supabase
        run: supabase start

      - name: Variables de entorno de Supabase
        # El build y los e2e necesitan las llaves del stack local (en dev viven
        # en .env.local). Los nombres cambian entre versiones del CLI:
        # ANON_KEY/SERVICE_ROLE_KEY (antiguas) vs PUBLISHABLE_KEY/SECRET_KEY.
        run: |
          supabase status -o env > /tmp/supabase.env
          get() { { grep -E "^$1=" /tmp/supabase.env || true; } | head -n1 | cut -d= -f2- | tr -d '"'; }
          ANON="$(get PUBLISHABLE_KEY)"; [ -n "$ANON" ] || ANON="$(get ANON_KEY)"
          SERVICE="$(get SECRET_KEY)"; [ -n "$SERVICE" ] || SERVICE="$(get SERVICE_ROLE_KEY)"
          CRON="$(openssl rand -hex 24)"; echo "::add-mask::$CRON"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            # `next start` es producción: sin estas dos no arranca (lib/env.ts).
            # El secreto se genera en cada ejecución y no sale del runner.
            echo "CRON_SECRET=$CRON"
            echo "APP_URL=http://localhost:3010"
          } >> "$GITHUB_ENV"

      - name: Integration tests (app)
        run: npm run test:integration

      - name: Integration tests (pgTAP)
        run: supabase test db

      - name: Build
        run: npm run build

      # La clave de service role no puede aparecer en nada de lo que se sirve
      # al navegador (KAM-23, design D14).
      - name: Service role fuera del paquete del navegador
        run: npm run check:bundle

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # La auditoría de accesibilidad va dentro de la suite y bloquea el PR.
      # La medición de rendimiento (`@performance`) no: corre en el trabajo de
      # estabilidad, porque el tiempo de un runner compartido varía demasiado
      # para decidir un PR (KAM-23, design D12).
      - name: End-to-end tests
        run: npm run test:e2e -- --grep-invert @performance

      # Aparte y al final: simula un despliegue cambiando `public/sw.js` en
      # disco, y ninguna otra prueba debe verlo (KAM-23).
      - name: Service worker tras un despliegue
        run: npx playwright test --project deployment
        env:
          E2E_DEPLOYMENT: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
