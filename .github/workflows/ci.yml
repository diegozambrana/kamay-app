name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: "latest" resuelve vía la API de GitHub sin autenticar
          # y falla por rate limit en los runners compartidos.
          version: 2.115.0

      - name: Start Supabase
        run: supabase start

      - name: Variables de entorno de Supabase
        # El build y los e2e necesitan las llaves del stack local (en dev viven
        # en .env.local). Los nombres cambian entre versiones del CLI:
        # ANON_KEY/SERVICE_ROLE_KEY (antiguas) vs PUBLISHABLE_KEY/SECRET_KEY.
        run: |
          supabase status -o env > /tmp/supabase.env
          get() { { grep -E "^$1=" /tmp/supabase.env || true; } | head -n1 | cut -d= -f2- | tr -d '"'; }
          ANON="$(get PUBLISHABLE_KEY)"; [ -n "$ANON" ] || ANON="$(get ANON_KEY)"
          SERVICE="$(get SECRET_KEY)"; [ -n "$SERVICE" ] || SERVICE="$(get SERVICE_ROLE_KEY)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
          } >> "$GITHUB_ENV"

      - name: Integration tests (app)
        run: npm run test:integration

      - name: Integration tests (pgTAP)
        run: supabase test db

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
