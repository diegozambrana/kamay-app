name: Estabilidad

# KAM-23 · design D4 y D12.
#
# El pipeline de cada pull request (`ci.yml`) conserva `retries: 2`: un
# reintento salva un PR de un hipo de red del runner, y eso está bien. Pero los
# reintentos son exactamente lo que hace que una suite intermitente se vea
# verde. Este trabajo demuestra la estabilidad en lugar de suponerla: corre la
# suite completa **sin reintentos y varias veces**, y cualquier prueba que pase
# en una vuelta y falle en otra rompe el trabajo con su nombre.
#
# Corre sobre `main` y bajo demanda, no en cada PR: tarda varias veces lo que
# tarda la suite, y la medición de rendimiento que lo acompaña es demasiado
# sensible al runner compartido para decidir un PR.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repeat:
        description: "Vueltas de la suite completa"
        default: "3"

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # La misma versión fija que `ci.yml`.
          version: 2.115.0

      - name: Start Supabase
        run: supabase start

      - name: Variables de entorno de Supabase
        run: |
          supabase status -o env > /tmp/supabase.env
          get() { { grep -E "^$1=" /tmp/supabase.env || true; } | head -n1 | cut -d= -f2- | tr -d '"'; }
          ANON="$(get PUBLISHABLE_KEY)"; [ -n "$ANON" ] || ANON="$(get ANON_KEY)"
          SERVICE="$(get SECRET_KEY)"; [ -n "$SERVICE" ] || SERVICE="$(get SERVICE_ROLE_KEY)"
          CRON="$(openssl rand -hex 24)"; echo "::add-mask::$CRON"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            # `next start` es producción: sin estas dos no arranca (lib/env.ts).
            # El secreto se genera en cada ejecución y no sale del runner.
            echo "CRON_SECRET=$CRON"
            echo "APP_URL=http://localhost:3010"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Sin reintentos y con repeticiones: una prueba intermitente falla aquí
      # por definición, y el informe la nombra.
      - name: Suite completa, sin reintentos, repetida
        run: npx playwright test --retries=0 --repeat-each=${{ inputs.repeat || '3' }} --grep-invert @performance

      # El presupuesto de carga del panel, contra «Kamay Rendimiento» (un año
      # de datos) y con el perfil de un móvil de gama media. Tres vueltas: una
      # sola lenta ya es una regresión que hay que mirar.
      - name: Presupuesto de carga del panel
        run: npx playwright test --grep @performance --retries=0 --repeat-each=3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-stability
          path: playwright-report/
          retention-days: 14
