<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ffffff; font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #18181b; } a:hover { color: #52525b; }
</style>
</helmet>
<div style="min-width: 1440px; min-height: 100vh; display: flex; flex-direction: column; background: #ffffff; color: #09090b;">

  <header style="flex: none; height: 56px; padding: 0 16px; border-bottom: 1px solid #e4e4e7; background: #ffffff; display: flex; align-items: center; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 8px; flex: none;">
      <span style="width: 26px; height: 26px; border-radius: 6px; background: #18181b; color: #fafafa; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;">G</span>
      <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">Geeko Store</span>
    </div>

    <div style="display: flex; align-items: center; gap: 2px; padding: 3px; background: #f4f4f5; border-radius: 8px; flex: none;">
      <button type="button" onClick="{{ verTodas }}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: none; background: none; color: #52525b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="color: #09090b;">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #a1a1aa;"></span>Todas
      </button>
      <button type="button" onClick="{{ verSublimacion }}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: none; background: #ffffff; color: #09090b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(9,9,11,0.06);">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #2563eb;"></span>Sublimación
      </button>
      <button type="button" onClick="{{ ver3d }}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: none; background: none; color: #52525b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="color: #09090b;">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #7c3aed;"></span>Impresión 3D
      </button>
      <button type="button" onClick="{{ verAlfareria }}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: none; background: none; color: #52525b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="color: #09090b;">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #ea580c;"></span>Alfarería
      </button>
    </div>

    <span style="flex: 1;"></span>

    <div style="position: relative; display: flex; align-items: center; flex: none;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 9px; pointer-events: none;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="text" placeholder="Buscar pedido o cliente" style="width: 240px; height: 34px; padding: 0 10px 0 30px; border: 1px solid #e4e4e7; border-radius: 8px; background: #ffffff; color: #09090b; font-family: inherit; font-size: 13px; outline: none;">
    </div>

    <button type="button" style="position: relative; width: 34px; height: 34px; border: 1px solid #e4e4e7; background: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none;" style-hover="background: #f4f4f5;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#09090b" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path><path d="M10.5 20a2 2 0 003 0"></path></svg>
      <span style="position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: #dc2626; color: #ffffff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{ notificaciones }}</span>
    </button>

    <div style="display: flex; align-items: center; gap: 8px; flex: none;">
      <span style="width: 32px; height: 32px; border-radius: 999px; background: #f4f4f5; border: 1px solid #e4e4e7; color: #52525b; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">DZ</span>
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </header>

  <div style="flex: none; height: 48px; padding: 0 16px; border-bottom: 1px solid #e4e4e7; background: #fafafa; display: flex; align-items: center; gap: 8px;">
    <button type="button" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="background: #f4f4f5;">
      Cliente<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="background: #f4f4f5;">
      Canal de venta<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="background: #f4f4f5;">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      12 – 26 ago<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>

    <span style="flex: 1;"></span>

    <label style="display: flex; align-items: center; gap: 7px; font-size: 13px; color: #52525b; cursor: pointer; user-select: none;">
      <input type="checkbox" style="width: 15px; height: 15px; accent-color: #18181b; cursor: pointer;">Ver archivados
    </label>

    <div style="display: flex; align-items: center; gap: 2px; padding: 3px; background: #f4f4f5; border-radius: 8px;">
      <sc-for list="{{ vistas }}" as="v" hint-placeholder-count="3">
        <sc-if value="{{ v.activa }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ v.set }}" style="height: 26px; padding: 0 10px; border: none; background: #ffffff; color: #09090b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(9,9,11,0.06);">{{ v.nombre }}</button>
        </sc-if>
        <sc-if value="{{ v.inactiva }}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{ v.set }}" style="height: 26px; padding: 0 10px; border: none; background: none; color: #52525b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="color: #09090b;">{{ v.nombre }}</button>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-x: auto; padding: 16px; background: #fafafa;">
    <div style="display: flex; align-items: flex-start; gap: 12px; min-height: 620px;">
      <sc-for list="{{ columnas }}" as="col" hint-placeholder-count="6">
        <section style="flex: none; width: 272px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px 0 2px; min-height: 28px;">
            <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.01em;">{{ col.nombre }}</span>
            <span style="min-width: 20px; height: 20px; padding: 0 6px; border-radius: 6px; background: #e4e4e7; color: #52525b; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{ col.total }}</span>
            <span style="flex: 1;"></span>
            <button type="button" style="width: 24px; height: 24px; border: 1px solid #e4e4e7; background: #ffffff; color: #52525b; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit; font-size: 14px; line-height: 1;" style-hover="background: #f4f4f5; color: #09090b;">+</button>
          </div>
          <sc-if value="{{ col.esCola }}" hint-placeholder-val="{{ false }}">
            
          </sc-if>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            <sc-for list="{{ col.pedidos }}" as="p" hint-placeholder-count="2">
              <article style="display: flex; gap: 10px; padding: 10px 10px 10px 9px; background: #ffffff; border: 1px solid #e4e4e7; border-left: 3px solid #2563eb; border-radius: 8px;">
                <sc-if value="{{ p.tienePosicion }}" hint-placeholder-val="{{ false }}">
                  <span style="flex: none; width: 22px; height: 22px; border-radius: 999px; background: #18181b; color: #fafafa; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-top: 1px;">{{ p.posicion }}</span>
                </sc-if>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
                  <div style="display: flex; flex-direction: column; gap: 2px;">
                    <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.01em;">{{ p.cliente }}</span>
                    <span style="font-size: 12px; color: #52525b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ p.resumen }}</span>
                  </div>

                  <div style="display: flex; align-items: center; gap: 8px;">
                    <sc-if value="{{ p.vencido }}" hint-placeholder-val="{{ false }}">
                      <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #dc2626;">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>{{ p.fecha }}
                      </span>
                    </sc-if>
                    <sc-if value="{{ p.hoy }}" hint-placeholder-val="{{ false }}">
                      <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #b45309;">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>{{ p.fecha }}
                      </span>
                    </sc-if>
                    <sc-if value="{{ p.futuro }}" hint-placeholder-val="{{ true }}">
                      <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: #71717a;">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>{{ p.fecha }}
                      </span>
                    </sc-if>

                    <sc-if value="{{ p.esDelivery }}" hint-placeholder-val="{{ false }}">
                      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#52525b" stroke-width="1.8" stroke-linecap="round" title="Delivery"><path d="M2 7h10v9H2z"></path><path d="M12 11h5l3 3v2h-8z"></path><circle cx="6" cy="18" r="1.8"></circle><circle cx="16.5" cy="18" r="1.8"></circle></svg>
                    </sc-if>
                    <sc-if value="{{ p.esLocal }}" hint-placeholder-val="{{ true }}">
                      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#52525b" stroke-width="1.8" stroke-linecap="round" title="Recojo en taller"><path d="M3 9l2-5h14l2 5"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path></svg>
                    </sc-if>

                    <sc-if value="{{ p.tieneTareas }}" hint-placeholder-val="{{ false }}">
                      <span style="display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: #52525b;">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#52525b" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M3.5 6l1.2 1.2L7 5"></path><path d="M3.5 12l1.2 1.2L7 11"></path><path d="M4 18h.01"></path></svg>{{ p.tareas }}
                      </span>
                    </sc-if>

                    <span style="flex: 1;"></span>

                    <sc-if value="{{ p.pagado }}" hint-placeholder-val="{{ false }}">
                      <span style="height: 20px; padding: 0 7px; border-radius: 6px; background: #18181b; color: #fafafa; font-size: 11px; font-weight: 500; display: flex; align-items: center;">Pagado</span>
                    </sc-if>
                    <sc-if value="{{ p.anticipo }}" hint-placeholder-val="{{ true }}">
                      <span style="height: 20px; padding: 0 7px; border-radius: 6px; border: 1px solid #e4e4e7; background: #ffffff; color: #52525b; font-size: 11px; font-weight: 500; display: flex; align-items: center;">Anticipo</span>
                    </sc-if>
                    <sc-if value="{{ p.sinPago }}" hint-placeholder-val="{{ false }}">
                      <span style="height: 20px; padding: 0 7px; border-radius: 6px; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 11px; font-weight: 500; display: flex; align-items: center;">Sin pago</span>
                    </sc-if>
                  </div>

                  <sc-if value="{{ p.alerta }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; align-items: center; gap: 5px; padding-top: 2px; border-top: 1px solid #f4f4f5; margin-top: 1px;">
                      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>
                      <span style="font-size: 11px; font-weight: 600; color: #dc2626;">{{ p.textoAlerta }}</span>
                    </div>
                  </sc-if>
                </div>
              </article>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;notificaciones&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { vista: "Tablero" };

  pedidos = [
    { col: "Registrado", cliente: "Marisol Quispe", resumen: "20 tazas mágicas 11oz", fecha: "22 ago", sem: "futuro", entrega: "delivery", pago: "Anticipo", tareas: 2 },
    { col: "Registrado", cliente: "Ferretería San Roque", resumen: "50 posavasos cuadrados", fecha: "19 ago", sem: "hoy", entrega: "local", pago: "Sin pago", tareas: 0 },
    { col: "En diseño", cliente: "Colegio Don Bosco", resumen: "35 mousepads gamer XL", fecha: "18 ago", sem: "vencido", entrega: "local", pago: "Anticipo", tareas: 3, retraso: "1 día de retraso" },
    { col: "En diseño", cliente: "Iván Cabrera", resumen: "12 imanes personalizados", fecha: "24 ago", sem: "futuro", entrega: "delivery", pago: "Pagado", tareas: 0 },
    { col: "En cola", cliente: "Café Illimani", resumen: "8 cuadros de metal A4", fecha: "18 ago", sem: "vencido", entrega: "local", pago: "Pagado", tareas: 1, espera: 4 },
    { col: "En cola", cliente: "Rosa Mamani", resumen: "24 tazas blancas 11oz", fecha: "20 ago", sem: "futuro", entrega: "delivery", pago: "Anticipo", tareas: 0, espera: 2 },
    { col: "En cola", cliente: "Gimnasio Titanes", resumen: "30 tazas mágicas 11oz", fecha: "21 ago", sem: "futuro", entrega: "local", pago: "Anticipo", tareas: 0, espera: 1 },
    { col: "Sublimando", cliente: "Radio Pachamama", resumen: "16 mousepads gamer XL", fecha: "18 ago", sem: "vencido", entrega: "local", pago: "Pagado", tareas: 1, retraso: "1 día de retraso" },
    { col: "Listo para entrega", cliente: "Boutique Ayni", resumen: "10 tazas mágicas 11oz", fecha: "17 ago", sem: "vencido", entrega: "delivery", pago: "Pagado", tareas: 0 },
    { col: "Listo para entrega", cliente: "Sergio Villarroel", resumen: "6 posavasos + 2 imanes", fecha: "19 ago", sem: "hoy", entrega: "local", pago: "Anticipo", tareas: 1 },
    { col: "Entregado", cliente: "Farmacia Bolivia", resumen: "40 tazas blancas 11oz", fecha: "15 ago", sem: "futuro", entrega: "local", pago: "Pagado", tareas: 0 }
  ];

  orden = ["Registrado", "En diseño", "En cola", "Sublimando", "Listo para entrega", "Entregado"];

  renderVals() {
    const sinAlerta = { "En cola": true, "Listo para entrega": true, "Entregado": true };
    const mapa = (p) => ({
      cliente: p.cliente, resumen: p.resumen, fecha: p.fecha,
      vencido: p.sem === "vencido", hoy: p.sem === "hoy", futuro: p.sem === "futuro",
      esDelivery: p.entrega === "delivery", esLocal: p.entrega === "local",
      tieneTareas: p.tareas > 0, tareas: p.tareas,
      pagado: p.pago === "Pagado", anticipo: p.pago === "Anticipo", sinPago: p.pago === "Sin pago",
      alerta: !!p.retraso && !sinAlerta[p.col], textoAlerta: p.retraso || "",
      tienePosicion: !!p.espera, posicion: p.posicion || 0
    });

    const columnas = this.orden.map(nombre => {
      let lista = this.pedidos.filter(p => p.col === nombre);
      if (nombre === "En cola") {
        lista = lista.slice().sort((a, b) => b.espera - a.espera).map((p, i) => Object.assign({}, p, { posicion: i + 1 }));
      }
      return { nombre, total: lista.length, esCola: nombre === "En cola", pedidos: lista.map(mapa) };
    });

    return {
      notificaciones: this.props.notificaciones ?? 4,
      columnas,
      vistas: ["Tablero", "Lista", "Calendario"].map(n => ({
        nombre: n, activa: this.state.vista === n, inactiva: this.state.vista !== n,
        set: () => this.setState({ vista: n })
      })),
      verTodas: () => {}, verSublimacion: () => {}, ver3d: () => {}, verAlfareria: () => {}
    };
  }
}
</script>
</body>
</html>
