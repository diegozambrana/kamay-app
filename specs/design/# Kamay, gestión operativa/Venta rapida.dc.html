<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #fafafa; font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #18181b; } a:hover { color: #52525b; }
  @keyframes kamaySheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes kamayToastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 0; background: #f4f4f5;">
  <div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #ffffff; color: #09090b; display: flex; flex-direction: column; border: 1px solid #e4e4e7; border-radius: 12px;">

    <header style="flex: none; padding: 10px 12px 8px 12px; border-bottom: 1px solid #e4e4e7; background: #ffffff; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 10px; height: 10px; border-radius: 999px; background: #f97316; flex: none;"></span>
        <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">Alfarería</span>
        <span style="font-size: 12px; color: #71717a; font-weight: 500;">· Modo feria</span>
        <span style="flex: 1;"></span>
        <button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="background: #f4f4f5;">Salir</button>
      </div>
      <sc-if value="{{ offline }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex;">
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid #e4e4e7; background: #f4f4f5; color: #52525b; font-size: 11px; font-weight: 500;">
            <span style="width: 6px; height: 6px; border-radius: 999px; background: #a1a1aa;"></span>
Sin conexión ·<span style="margin: 0 3px;">{{ offlineCount }}</span>ventas por sincronizar
          </span>
        </div>
      </sc-if>
    </header>

    <main style="flex: 1; overflow-y: auto; padding: 12px 12px 16px 12px;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <sc-for list="{{ productos }}" as="p" hint-placeholder-count="8">
          <button type="button" onClick="{{ p.add }}" style="position: relative; display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden; text-align: left; background: #ffffff; border: 1px solid #e4e4e7; border-left-width: 3px; border-left-color: #f97316; border-radius: 10px; cursor: pointer; font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent;" style-active="background: #f4f4f5;">
            <div style="position: relative; box-sizing: border-box; aspect-ratio: 1 / 1; width: 100%; background-color: #f4f4f5; background-image: repeating-linear-gradient(135deg, #e4e4e7 0 6px, #f4f4f5 6px 12px); display: flex; align-items: flex-end; padding: 6px;">
              <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; color: #71717a; background: rgba(255,255,255,0.86); padding: 1px 4px; border-radius: 3px;">{{ p.slot }}</span>
              <sc-if value="{{ p.enCarrito }}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: 6px; right: 6px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; background: #18181b; color: #fafafa; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{ p.cantidad }}</span>
              </sc-if>
            </div>
            <div style="padding: 8px 10px 10px 10px; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 13px; font-weight: 500; line-height: 1.25; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-wrap: pretty;">{{ p.nombre }}</span>
              <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">Bs {{ p.precio }}</span>
            </div>
          </button>
        </sc-for>
      </div>
    </main>

    <div style="flex: none; border-top: 1px solid #e4e4e7; background: #ffffff; padding: 10px 12px 14px 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 13px; color: #71717a; font-weight: 500;">{{ etiquetaArticulos }}</span>
        <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;">Bs {{ total }}</span>
      </div>
      <button type="button" onClick="{{ abrirCobro }}" style="width: 100%; height: 60px; border: none; border-radius: 10px; background: #18181b; color: #fafafa; font-family: inherit; font-size: 19px; font-weight: 600; cursor: pointer;" style-hover="background: #27272a;" style-active="background: #3f3f46;">Cobrar</button>
    </div>

    <sc-if value="{{ sheetAbierto }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ cerrarCobro }}" style="position: absolute; inset: 0; background: rgba(9,9,11,0.6);"></div>
    </sc-if>
    <sc-if value="{{ sheetAbierto }}" hint-placeholder-val="{{ false }}">
      <section style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; display: flex; flex-direction: column; background: #ffffff; border-top: 1px solid #e4e4e7; border-radius: 14px 14px 0 0; animation: kamaySheetUp 180ms ease-out;">
        <div style="flex: none; padding: 14px 16px 10px 16px; display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 16px; font-weight: 600;">Cobrar venta</span>
          <button type="button" onClick="{{ cerrarCobro }}" style="height: 32px; padding: 0 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;" style-hover="background: #f4f4f5;">Cerrar</button>
        </div>
        <div style="height: 1px; background: #e4e4e7;"></div>

        <div style="flex: 1; overflow-y: auto; padding: 12px 16px 4px 16px; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ lineas }}" as="l" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="font-size: 14px; font-weight: 500; line-height: 1.25;">{{ l.nombre }}</span>
                <span style="font-size: 12px; color: #71717a;">{{ l.detalle }}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; flex: none;">
                <button type="button" onClick="{{ l.menos }}" style="width: 44px; height: 44px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; border-radius: 8px; font-family: inherit; font-size: 20px; font-weight: 600; cursor: pointer;" style-hover="background: #f4f4f5;">−</button>
                <span style="min-width: 24px; text-align: center; font-size: 16px; font-weight: 600;">{{ l.cantidad }}</span>
                <button type="button" onClick="{{ l.mas }}" style="width: 44px; height: 44px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; border-radius: 8px; font-family: inherit; font-size: 20px; font-weight: 600; cursor: pointer;" style-hover="background: #f4f4f5;">+</button>
              </div>
              <span style="width: 68px; text-align: right; font-size: 15px; font-weight: 600; flex: none;">Bs {{ l.subtotal }}</span>
            </div>
          </sc-for>
        </div>

        <div style="flex: none; padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
          <div style="height: 1px; background: #e4e4e7;"></div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <sc-if value="{{ selEfectivo }}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{ pagoEfectivo }}" style="height: 56px; border-radius: 10px; border: 1px solid #18181b; background: #18181b; color: #fafafa; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">Efectivo</button>
            </sc-if>
            <sc-if value="{{ noEfectivo }}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{ pagoEfectivo }}" style="height: 56px; border-radius: 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;" style-hover="background: #f4f4f5;">Efectivo</button>
            </sc-if>
            <sc-if value="{{ selTransferencia }}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{ pagoTransferencia }}" style="height: 56px; border-radius: 10px; border: 1px solid #18181b; background: #18181b; color: #fafafa; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">Transferencia</button>
            </sc-if>
            <sc-if value="{{ noTransferencia }}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{ pagoTransferencia }}" style="height: 56px; border-radius: 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #09090b; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;" style-hover="background: #f4f4f5;">Transferencia</button>
            </sc-if>
          </div>

          <sc-if value="{{ clienteCerrado }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ abrirCliente }}" style="align-self: flex-start; height: 36px; padding: 0 2px; border: none; background: none; color: #52525b; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;" style-hover="color: #09090b;">+ Cliente (opcional)</button>
          </sc-if>
          <sc-if value="{{ clienteAbierto }}" hint-placeholder-val="{{ false }}">
            <input type="text" placeholder="Nombre del cliente" style="height: 44px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 8px; background: #ffffff; color: #09090b; font-family: inherit; font-size: 15px; outline: none;" />
          </sc-if>

          <button type="button" onClick="{{ confirmar }}" style="width: 100%; height: 60px; border: none; border-radius: 10px; background: #18181b; color: #fafafa; font-family: inherit; font-size: 19px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;" style-hover="background: #27272a;">
              <span>Confirmar venta</span>
              <span style="font-weight: 600; opacity: 0.7;">Bs {{ total }}</span>
          </button>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 12px; right: 12px; bottom: 138px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #18181b; color: #fafafa; border-radius: 10px; animation: kamayToastIn 140ms ease-out;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #f97316; flex: none;"></span>
        <span style="font-size: 14px; font-weight: 500;">{{ toast }}</span>
      </div>
    </sc-if>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:438,&quot;height&quot;:892},&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;offlineCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;pagoPorDefecto&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Efectivo&quot;,&quot;Transferencia&quot;],&quot;default&quot;:&quot;Efectivo&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  catalogo = [
    { id: "taza-esmaltada", nombre: "Taza artesanal esmaltada", precio: 95, slot: "foto producto" },
    { id: "maceta-gres", nombre: "Maceta de gres mediana", precio: 120, slot: "foto producto" },
    { id: "llavero-3d", nombre: "Llavero 3D personalizado", precio: 25, slot: "foto producto" },
    { id: "posavasos-gres", nombre: "Posavasos de gres (4)", precio: 80, slot: "foto producto" },
    { id: "jarron", nombre: "Jarrón torneado 25 cm", precio: 180, slot: "foto producto" },
    { id: "maceta-colgante", nombre: "Maceta colgante 3D", precio: 65, slot: "foto producto" },
    { id: "bowl", nombre: "Bowl de cerámica 14 cm", precio: 70, slot: "foto producto" },
    { id: "soporte-celular", nombre: "Soporte de celular 3D", precio: 45, slot: "foto producto" }
  ];

  state = { carrito: {}, sheet: false, pago: null, cliente: false, toast: "" };

  componentDidMount() { this.pago0 = true; }

  add = (id) => this.setState(s => ({ carrito: Object.assign({}, s.carrito, { [id]: (s.carrito[id] || 0) + 1 }) }));

  sumar = (id, d) => this.setState(s => {
    const c = Object.assign({}, s.carrito);
    const n = (c[id] || 0) + d;
    if (n <= 0) delete c[id]; else c[id] = n;
    return { carrito: c, sheet: Object.keys(c).length > 0 ? s.sheet : false };
  });

  confirmar = () => {
    this.setState({ carrito: {}, sheet: false, cliente: false, pago: null, toast: "Venta registrada" });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: "" }), 1800);
  };

  renderVals() {
    const carrito = this.state.carrito;
    const pago = this.state.pago === null ? (this.props.pagoPorDefecto || "Efectivo") : this.state.pago;
    const items = Object.keys(carrito).reduce((a, k) => a + carrito[k], 0);
    const total = this.catalogo.reduce((a, p) => a + (carrito[p.id] || 0) * p.precio, 0);
    const sel = "background: #18181b; color: #fafafa; border-color: #18181b;";

    return {
      offline: this.props.offline ?? true,
      offlineCount: this.props.offlineCount ?? 3,
      productos: this.catalogo.map(p => ({
        nombre: p.nombre, precio: p.precio, slot: p.slot,
        cantidad: carrito[p.id] || 0, enCarrito: !!carrito[p.id],
        add: () => this.add(p.id)
      })),
      lineas: this.catalogo.filter(p => carrito[p.id]).map(p => ({
        nombre: p.nombre, detalle: "Bs " + p.precio + " c/u",
        cantidad: carrito[p.id], subtotal: carrito[p.id] * p.precio,
        mas: () => this.sumar(p.id, 1), menos: () => this.sumar(p.id, -1)
      })),
      etiquetaArticulos: items === 1 ? "1 artículo" : items + " artículos",
      total,
      sheetAbierto: this.state.sheet,
      abrirCobro: () => { if (items > 0) this.setState({ sheet: true }); },
      cerrarCobro: () => this.setState({ sheet: false }),
      pagoEfectivo: () => this.setState({ pago: "Efectivo" }),
      pagoTransferencia: () => this.setState({ pago: "Transferencia" }),
      selEfectivo: pago === "Efectivo",
      noEfectivo: pago !== "Efectivo",
      selTransferencia: pago === "Transferencia",
      noTransferencia: pago !== "Transferencia",
      clienteCerrado: !this.state.cliente,
      clienteAbierto: this.state.cliente,
      abrirCliente: () => this.setState({ cliente: true }),
      confirmar: this.confirmar,
      toast: this.state.toast
    };
  }
}
</script>
</body>
</html>
